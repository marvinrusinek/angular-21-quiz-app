# Render Blueprint for the Interview API.
#
# Import this from the Render dashboard (New → Blueprint) and it creates the
# service with the right settings. Host-agnostic alternatives (Fly.io,
# Railway) work from the same backend/Dockerfile — see backend/DEPLOY.md.
#
# Runs on the FREE tier with an EPHEMERAL database in /tmp — a deliberate
# trade-off, not an oversight. What it means in practice:
#
#   * Sessions do not survive a restart. Render spins a free service down after
#     ~15 minutes idle and wipes its filesystem, so an interview submitted
#     before that becomes unreachable and its Results page reports the service
#     as unavailable.
#   * The user does NOT lose their score. Interview History is client-side and
#     already sanitized, so the attempt, percentage and per-topic breakdown all
#     survive. Only the per-question review — which lives on the server by
#     design — is gone.
#   * An interview in progress is safe: answering sends traffic, and a service
#     with traffic does not idle out. Assessments are 15 minutes anyway.
#   * The first request after an idle period pays a cold start of roughly
#     30-60 seconds. Starting an interview can feel slow, or time out and show
#     the retry state.
#
# To make sessions durable later: switch `plan` to `starter`, restore the
# `disk:` block shown at the bottom of this file, and set DATABASE_PATH back to
# /data/sessions.db. Nothing else changes.

services:
  - type: web
    name: interview-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    # The Dockerfile copies data/quiz.json relative to the backend directory.
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      # Render supplies PORT; the app reads it. Do not hard-code it.

      # EXACT origins allowed to call this API. The config rejects a wildcard
      # outright and requires https in production, so this cannot be loosened
      # by accident. Add your local origin only if you want to point a dev
      # frontend at the hosted API.
      #
      # The second entry is the StackBlitz preview. Its host contains a SESSION
      # HASH that StackBlitz regenerates, so this will stop matching eventually
      # and the preview will fail CORS again — replace it with the new origin
      # when that happens, or ask for suffix matching, which the origin check
      # deliberately does not do today.
      - key: ALLOWED_ORIGINS
        value: https://marvinrusinek.github.io,https://angular22quizapp-uyfq--4200--87cf54cd.local-credentialless.webcontainer.io

      # Ephemeral on purpose — see the note at the top. /tmp is always
      # writable, so this needs no mounted volume and no paid plan.
      - key: DATABASE_PATH
        value: /tmp/sessions.db

# Durable sessions, when you want them: set `plan: starter` above, point
# DATABASE_PATH at /data/sessions.db, and uncomment this.
#
#    disk:
#      name: interview-sessions
#      mountPath: /data
#      sizeGB: 1
